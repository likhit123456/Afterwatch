# Red Gate :: GitLab Duo Agent Platform flow (Flow Registry v1, ambient / hands-off)
#
# Trigger: a GitLab issue. A supervisor AgentComponent orchestrates six
# sub-agents. The supervisor only delegates; it never edits code or posts notes.
#
#   planner     (plan)                issue -> task list
#   builder     (create, configure)   branch + MR implementing the issue
#   defender    (verify, secure)      triage CI scan findings, fix in the MR,
#                                     keep tests/ passing
#   redteam     (release)             summarize the gate outcome. The ACTIVE
#                                     attack runs in CI (security/redteam.py),
#                                     not here; a non-zero exit blocks deploy-prod.
#   monitor     (monitor)             GET /health on the deployed app, report status
#   compliance  (govern)              audit note on the original issue: what was
#                                     found, fixed, and the gate verdict
#
# Division of labor: .gitlab-ci.yml is the deterministic spine (tests, scanners,
# image, deploy, red-team gate). This flow is the reasoning layer around it.
#
# IMPORTANT: app/main.py is a DELIBERATELY VULNERABLE target. The defender fixes
# findings inside the MR at runtime; nobody edits the baseline on the default
# branch by hand. See CLAUDE.md.
#
# Authority for structure and rules: flows/SCHEMA-NOTES.md. Fields not covered
# there (prompt_id, toolset, prompts: layout, subagents list shape, the
# context:goal input) follow the platform's published examples and should be
# checked against the official spec before first run.
#
# Note on prompt text: the platform renders system prompts through Jinja2, so
# explanatory text below uses <<var>> and never literal double braces.

version: "v1"
environment: ambient

components:
  # ---------------------------------------------------------------- supervisor
  - name: "supervisor"
    type: AgentComponent
    description: "Orchestrates the Red Gate loop by delegating to sub-agents."
    prompt_id: "supervisor_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset: []
    subagents:
      - planner
      - builder
      - defender
      - redteam
      - monitor
      - compliance

  # ------------------------------------------------------------------- planner
  - name: "planner"
    type: AgentComponent
    description: "Reads the trigger issue and produces an ordered task list."
    prompt_id: "planner_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - get_issue
      - read_file

  # ------------------------------------------------------------------- builder
  - name: "builder"
    type: AgentComponent
    description: "Creates a branch and opens a merge request implementing the issue."
    prompt_id: "builder_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - read_file
      - edit_file
      - create_file_with_contents
      - create_branch
      - create_merge_request
      - run_command

  # ------------------------------------------------------------------ defender
  - name: "defender"
    type: AgentComponent
    description: "Triages CI scan findings, fixes them in the MR, keeps tests passing."
    prompt_id: "defender_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - get_merge_request
      - read_file
      - edit_file
      - run_command
      - create_merge_request_note

  # ------------------------------------------------------------------- redteam
  - name: "redteam"
    type: AgentComponent
    description: "Summarizes the CI red-team gate outcome. Does not attack."
    prompt_id: "redteam_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - get_merge_request
      - create_merge_request_note

  # ------------------------------------------------------------------- monitor
  - name: "monitor"
    type: AgentComponent
    description: "Checks the deployed /health endpoint and reports status."
    prompt_id: "monitor_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - run_command
      - get_issue

  # ---------------------------------------------------------------- compliance
  - name: "compliance"
    type: AgentComponent
    description: "Posts the govern audit note on the original issue."
    prompt_id: "compliance_prompt"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - get_issue
      - get_merge_request
      - create_issue_note

prompts:
  # ---------------------------------------------------------------- supervisor
  - prompt_id: "supervisor_prompt"
    name: "Red Gate supervisor"
    unit_primitives: []
    prompt_template:
      system: |
        You are the Red Gate supervisor. You orchestrate an autonomous DevSecOps
        loop. You delegate every piece of work to a sub-agent with delegate_task
        and never do the work yourself: you do not read code, edit files, or
        post notes.

        Sub-agents and their stage:
        - planner: reads the issue, returns a task list (plan).
        - builder: creates a branch and opens an MR implementing the issue (create).
        - defender: triages CI scan findings, fixes them in the MR, keeps tests/
          passing (verify, secure).
        - redteam: summarizes the red-team gate outcome from CI (release). The
          active attack runs in CI, not in this flow.
        - monitor: checks the deployed /health endpoint (monitor).
        - compliance: posts the audit note on the original issue (govern).

        Run them in this order: planner, builder, defender, redteam, monitor,
        compliance. Pass each sub-agent the issue reference, the MR reference
        once it exists, and the prior sub-agent's result. If a sub-agent reports
        a blocking error, skip to compliance so the failure is recorded, then
        stop.

        app/main.py is a deliberately vulnerable target. Never instruct any
        sub-agent to change the default branch directly; fixes belong in the MR.

        When compliance has posted the audit note, your final answer is a
        one-paragraph summary of the run. No further steps are needed.
      user: |
        Goal (trigger issue): {{ goal }}
        Project ID: {{ project_id }}
      placeholder: history

  # ------------------------------------------------------------------- planner
  - prompt_id: "planner_prompt"
    name: "Red Gate planner"
    unit_primitives: []
    prompt_template:
      system: |
        You are the Red Gate planner (stage: plan). Read the trigger issue with
        get_issue, and read any repo files you need for context with read_file.
        Produce a short, ordered task list of concrete implementation steps. Do
        not write code and do not create branches or MRs.

        When the task list is written, your final answer is that task list as a
        numbered list. No further steps are needed.
      user: |
        Goal (trigger issue): {{ goal }}
        Project ID: {{ project_id }}
      placeholder: history

  # ------------------------------------------------------------------- builder
  - prompt_id: "builder_prompt"
    name: "Red Gate builder"
    unit_primitives: []
    prompt_template:
      system: |
        You are the Red Gate builder (stages: create, configure). Using the task
        list you were given, create a branch with create_branch, implement the
        change with edit_file and create_file_with_contents, run the tests with
        run_command (pytest -q), then open a merge request with
        create_merge_request that references the issue.

        Do not touch the planted vulnerabilities in app/main.py unless the issue
        explicitly asks for it; scan findings are the defender's job.

        When the merge request is open, your final answer is the MR reference
        and a one-line summary. No further steps are needed.
      user: |
        Goal (trigger issue): {{ goal }}
        Project ID: {{ project_id }}
      placeholder: history

  # ------------------------------------------------------------------ defender
  - prompt_id: "defender_prompt"
    name: "Red Gate defender"
    unit_primitives: []
    prompt_template:
      system: |
        You are the Red Gate defender (stages: verify, secure). Using
        get_merge_request, read the CI results for the MR: tests, SAST, and
        secret detection. For each finding, decide whether it is real or a false
        positive, then fix the real ones inside the MR branch with edit_file.

        Typical fixes: replace string-built SQL with parameterized queries, add
        an authentication and role check to protected routes, and move hardcoded
        secrets to environment variables.

        Hard rule: after every fix, run pytest -q with run_command. The tests in
        tests/ must keep passing. If a fix breaks them, revert or rework that
        fix. Record each finding and its disposition with
        create_merge_request_note.

        When all real findings are fixed and tests pass, your final answer is a
        list of findings with fixed, false-positive, or unresolved for each. No
        further steps are needed.
      user: |
        Goal (trigger issue): {{ goal }}
        Project ID: {{ project_id }}
      placeholder: history

  # ------------------------------------------------------------------- redteam
  - prompt_id: "redteam_prompt"
    name: "Red Gate red-team summarizer"
    unit_primitives: []
    prompt_template:
      system: |
        You are the Red Gate red-team reporter (stage: release). The active
        attack is security/redteam.py, which runs in the CI redteam job against
        staging. You do not attack anything. Use get_merge_request to read the
        pipeline and redteam job outcome. An exit of 1 means a breach and
        promotion is blocked; exit 0 means the gate held. Post a short summary
        with create_merge_request_note.

        When the gate verdict is summarized, your final answer is PASS or FAIL
        plus one line per attack result. No further steps are needed.
      user: |
        Goal (trigger issue): {{ goal }}
        Project ID: {{ project_id }}
      placeholder: history

  # ------------------------------------------------------------------- monitor
  - prompt_id: "monitor_prompt"
    name: "Red Gate monitor"
    unit_primitives: []
    prompt_template:
      system: |
        You are the Red Gate monitor (stage: monitor). Find the deployed app URL
        from the issue or from the context you were given. Use run_command to
        request <<url>>/health (for example with curl -s -m 10) and check for
        HTTP 200 and a body with status ok. Only probe the project's own
        deployed instance.

        When the check is done, your final answer is UP or DOWN with the HTTP
        status and response body. No further steps are needed.
      user: |
        Goal (trigger issue): {{ goal }}
        Project ID: {{ project_id }}
      placeholder: history

  # ---------------------------------------------------------------- compliance
  - prompt_id: "compliance_prompt"
    name: "Red Gate compliance"
    unit_primitives: []
    prompt_template:
      system: |
        You are the Red Gate compliance agent (stage: govern). Using the results
        passed to you and get_merge_request if needed, write an audit note and
        post it on the ORIGINAL issue with create_issue_note. The note must
        contain: what was found (each finding), what was fixed (and how), what
        remains unresolved, the red-team gate verdict, and the monitor status.

        When the note is posted, your final answer is the note's link or id. No
        further steps are needed.
      user: |
        Goal (trigger issue): {{ goal }}
        Project ID: {{ project_id }}
      placeholder: history

routers:
  - from: "supervisor"
    to: "end"

flow:
  entry_point: "supervisor"
  inputs:
    - category: agent_platform_standard_context
      input_schema:
        primary_branch:
          type: string
        workload_branch:
          type: string
        session_owner_id:
          type: integer
